logging:
  level:
    eu.nebulouscloud.exn: TRACE

spring:
  profiles: default
  main:
    web-application-type: none
  jms:
    pub-sub-domain: true

application:
  exn:
    config:
      url: '${ACTIVEMQ_HOST:nebulous-activemq}'
      port: '${ACTIVEMQ_PORT:5672}'
      username: '${ACTIVEMQ_USER:admin}'
      password: '${ACTIVEMQ_PASSWORD:admin}'
      connectTimeout: 20 #min
      readTimeout: 20 #min
  sal:
    protocol: 'http'
    host: '${SAL_HOST:nebulous-sal}'
    port: '${SAL_PORT:8080}'
    api: 'sal'
    username: '${SAL_USER}'
    password: '${SAL_PASSWORD}'
  proactive:
    protocol: 'http'
    host: '${PROACTIVE_HOST:nebulous-proactive}'
    port: '${PROACTIVE_PORT:8880}'
    api: 'rest'
    username: '${PROACTIVE_USER}'
    password: '${PROACTIVE_PASSWORD}'


  jms:
    topic: 'eu.nebulouscloud'